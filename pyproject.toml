[project]
name = "teams-rooms-mcp"
version = "0.1.0"
description = "MCP server for Microsoft Teams / Graph: teams, groups, meetings, calendars, directory, and breakout-room attendance tracking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2",
    "msal>=1.28",
    "httpx>=0.27",
]

[project.scripts]
teams-rooms-mcp = "teams_rooms_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teams_rooms_mcp"]
